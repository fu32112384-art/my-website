<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Nosebook</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f0f2f5;
}

.container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.box {
    background: white;
    padding: 25px;
    border-radius: 10px;
    width: 350px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.logo {
    text-align: center;
    margin-bottom: 20px;
}

.logo img {
    width: 200px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 5px;
    border: 1px solid #ddd;
}

button {
    width: 100%;
    padding: 12px;
    background: #1877f2;
    color: white;
    border: none;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="container">
    <div class="box">
        <div class="logo">
            <!-- 網路圖片 -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg">
            <h2>Nosebook</h2>
        </div>

        <input type="text" placeholder="電子郵件或手機號碼">
        <input type="password" placeholder="密碼">

        <button onclick="goNext()">登入</button>
    </div>
</div>

<script>
function goNext(){
    window.location.href = "phishing.html";
}
</script>

</body>
</html>
